<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>矩阵运算服务 - RPC框架演示</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .result-container {
            margin-top: 20px;
            min-height: 200px;
        }
        .matrix-input {
            width: 100%;
            height: 120px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">RPC框架演示</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/matrix-demo">矩阵运算</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/text-demo">AI文本服务</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>矩阵运算服务</h2>
        <p class="lead">本示例演示通过RPC调用远程矩阵运算服务和本地服务的对比</p>

        <div class="card mb-4">
            <div class="card-header">
                <ul class="nav nav-tabs card-header-tabs" id="operationTabs" role="tablist">
                    <li class="nav-item">
                        <a class="nav-link active" id="add-tab" data-bs-toggle="tab" href="#add" role="tab">矩阵加法</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="multiply-tab" data-bs-toggle="tab" href="#multiply" role="tab">矩阵乘法</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="transpose-tab" data-bs-toggle="tab" href="#transpose" role="tab">矩阵转置</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="determinant-tab" data-bs-toggle="tab" href="#determinant" role="tab">行列式计算</a>
                    </li>
                </ul>
            </div>
            <div class="card-body">
                <div class="tab-content" id="operationTabsContent">
                    <!-- 矩阵加法 -->
                    <div class="tab-pane fade show active" id="add" role="tabpanel">
                        <h5 class="card-title">矩阵加法</h5>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="matrixA1">矩阵 A (例如: [&#91;1,2&#93;,[&#91;3,4&#93;])</label>
                                    <textarea class="form-control matrix-input" id="matrixA1" th:text="'[[1, 2], [3, 4]]'"></textarea>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="matrixB1">矩阵 B (例如: [&#91;5,6&#93;,[&#91;7,8&#93;])</label>
                                    <textarea class="form-control matrix-input" id="matrixB1" th:text="'[[5, 6], [7, 8]]'"></textarea>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn btn-primary mt-3" onclick="calculateAdd()">计算矩阵加法</button>
                    </div>
                    
                    <!-- 矩阵乘法 -->
                    <div class="tab-pane fade" id="multiply" role="tabpanel">
                        <h5 class="card-title">矩阵乘法</h5>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="matrixA2">矩阵 A (例如: [&#91;1,2&#93;,[&#91;3,4&#93;])</label>
                                    <textarea class="form-control matrix-input" id="matrixA2" th:text="'[[1, 2], [3, 4]]'"></textarea>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="matrixB2">矩阵 B (例如: [&#91;5,6&#93;,[&#91;7,8&#93;])</label>
                                    <textarea class="form-control matrix-input" id="matrixB2" th:text="'[[5, 6], [7, 8]]'"></textarea>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn btn-primary mt-3" onclick="calculateMultiply()">计算矩阵乘法</button>
                    </div>
                    
                    <!-- 矩阵转置 -->
                    <div class="tab-pane fade" id="transpose" role="tabpanel">
                        <h5 class="card-title">矩阵转置</h5>
                        <div class="form-group">
                            <label for="matrixT">输入矩阵 (例如: [&#91;1,2,3&#93;,[&#91;4,5,6&#93;])</label>
                            <textarea class="form-control matrix-input" id="matrixT" th:text="'[[1, 2, 3], [4, 5, 6]]'"></textarea>
                        </div>
                        <button type="button" class="btn btn-primary mt-3" onclick="calculateTranspose()">计算矩阵转置</button>
                    </div>
                    
                    <!-- 行列式计算 -->
                    <div class="tab-pane fade" id="determinant" role="tabpanel">
                        <h5 class="card-title">行列式计算</h5>
                        <div class="form-group">
                            <label for="matrixD">输入方阵 (例如: [&#91;1,2&#93;,[&#91;3,4&#93;])</label>
                            <textarea class="form-control matrix-input" id="matrixD" th:text="'[[1, 2], [3, 4]]'"></textarea>
                        </div>
                        <button type="button" class="btn btn-primary mt-3" onclick="calculateDeterminant()">计算行列式</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 结果显示 -->
        <div class="card result-container">
            <div class="card-header">
                计算结果
            </div>
            <div class="card-body">
                <pre id="resultDisplay" class="bg-light p-3">这里将显示计算结果...</pre>
            </div>
        </div>
    </div>

    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.05);">
            © 2025 RPC框架演示
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function displayResult(result) {
            const resultDisplay = document.getElementById('resultDisplay');
            if (result.success) {
                let html = '';
                for (const key in result) {
                    if (key !== 'success') {
                        html += `<strong>${key}:</strong>\n${result[key]}\n\n`;
                    }
                }
                resultDisplay.innerHTML = html;
            } else {
                resultDisplay.innerHTML = `<div class="text-danger">错误: ${result.message}</div>`;
            }
        }

        function calculateAdd() {
            try {
                const matrixA = JSON.parse(document.getElementById('matrixA1').value);
                const matrixB = JSON.parse(document.getElementById('matrixB1').value);
                
                fetch('/matrix/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        a: matrixA,
                        b: matrixB
                    }),
                })
                .then(response => response.json())
                .then(data => {
                    displayResult(data);
                })
                .catch(error => {
                    document.getElementById('resultDisplay').innerHTML = `<div class="text-danger">请求错误: ${error}</div>`;
                });
            } catch (e) {
                document.getElementById('resultDisplay').innerHTML = `<div class="text-danger">输入格式错误: ${e.message}</div>`;
            }
        }

        function calculateMultiply() {
            try {
                const matrixA = JSON.parse(document.getElementById('matrixA2').value);
                const matrixB = JSON.parse(document.getElementById('matrixB2').value);
                
                fetch('/matrix/multiply', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        a: matrixA,
                        b: matrixB
                    }),
                })
                .then(response => response.json())
                .then(data => {
                    displayResult(data);
                })
                .catch(error => {
                    document.getElementById('resultDisplay').innerHTML = `<div class="text-danger">请求错误: ${error}</div>`;
                });
            } catch (e) {
                document.getElementById('resultDisplay').innerHTML = `<div class="text-danger">输入格式错误: ${e.message}</div>`;
            }
        }

        function calculateTranspose() {
            try {
                const matrix = JSON.parse(document.getElementById('matrixT').value);
                
                fetch('/matrix/transpose', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        matrix: matrix
                    }),
                })
                .then(response => response.json())
                .then(data => {
                    displayResult(data);
                })
                .catch(error => {
                    document.getElementById('resultDisplay').innerHTML = `<div class="text-danger">请求错误: ${error}</div>`;
                });
            } catch (e) {
                document.getElementById('resultDisplay').innerHTML = `<div class="text-danger">输入格式错误: ${e.message}</div>`;
            }
        }

        function calculateDeterminant() {
            try {
                const matrix = JSON.parse(document.getElementById('matrixD').value);
                
                fetch('/matrix/determinant', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        matrix: matrix
                    }),
                })
                .then(response => response.json())
                .then(data => {
                    displayResult(data);
                })
                .catch(error => {
                    document.getElementById('resultDisplay').innerHTML = `<div class="text-danger">请求错误: ${error}</div>`;
                });
            } catch (e) {
                document.getElementById('resultDisplay').innerHTML = `<div class="text-danger">输入格式错误: ${e.message}</div>`;
            }
        }
    </script>
</body>
</html>
